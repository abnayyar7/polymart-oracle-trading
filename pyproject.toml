[project]
name = "polymart-oracle-bot"
version = "3.0.0"
description = "ORACLE — Autonomous Polymarket prediction betting agent"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "feedparser>=6.0.11",
    "google-genai>=1.0.0",
    "telethon>=1.36.0",
    "schedule>=1.2.0",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
live = [
    "py-clob-client>=0.18.0",
    "web3>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "tools", "config"]
